<!DOCTYPE html>

<html>

<head>

<title>

Login

</title>

<link
rel="stylesheet"
href="{{ url_for(
'static',
filename='style.css'
) }}">

</head>


<body>

<div class="container">

<h1>

Login

</h1>


<form

action="/login"

method="POST"

>

<input

type="text"

name="username"

placeholder="Username"

required

>


<br><br>


<input

type="password"

name="password"

placeholder="Password"

required

>


<br><br>


<button>

Login

</button>

</form>

<p style="text-align: center; margin-top: 20px;">
    Don't have an account? <a href="/register">Register here</a>
</p>


<br>


<a href="/register">

Create Account

</a>

</div>

</body>

</html>
